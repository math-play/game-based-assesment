  .stage{
    width:100%;
    max-width:640px;
    margin:auto;
    position:relative;
    z-index:1;
  }
  .card{
    background:var(--cream);
    border-radius:28px;
    box-shadow:var(--card-shadow);
    padding:40px 28px 32px 28px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(212,175,55,0.35);
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:10px;
    background:repeating-linear-gradient(
      45deg,
      var(--gold) 0px, var(--gold) 8px,
      var(--indigo) 8px, var(--indigo) 16px
    );
  }
  .card::after{
    content:"";
    position:absolute;
    bottom:-50px; left:-50px;
    width:150px; height:150px;
    border:10px solid var(--gold);
    opacity:0.08;
    border-radius:50%;
  }
  h1,h2,h3{
    font-family:'Baloo 2', cursive;
    margin:0 0 8px 0;
    color:var(--ink);
  }
  h1{font-size:1.9rem;}
  h2{font-size:1.5rem;}
  p{line-height:1.5;}
  .muted{color:#6b6f80;}

  /* progress */
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .badges{display:flex;gap:6px;}
  .badge{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',cursive; font-weight:700; font-size:0.9rem;
    background:#EDE7D6; color:#a39a7c;
    border:2px solid transparent;
  }
  .badge.active{background:var(--indigo); color:var(--gold-light); border-color:var(--gold);}
  .badge.done{background:var(--gold); color:var(--indigo-deep);}
  .bar-track{flex:1; height:12px; background:#EDE7D6; border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--gold-dark), var(--gold)); border-radius:99px; transition:width .35s ease;}
  .qcount{font-family:'Baloo 2',cursive; font-size:0.95rem; color:#6b6f80; white-space:nowrap;}

  /* buttons */
  .btn{
    font-family:'Baloo 2', cursive;
    font-size:1.05rem;
    border:none;
    border-radius:16px;
    padding:14px 22px;
    cursor:pointer;
    color:var(--gold-light);
    background:var(--indigo);
    box-shadow:0 6px 0 var(--indigo-deep);
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--indigo-deep);}
  .btn.big{width:100%; font-size:1.2rem; padding:18px;}
  .btn.secondary{background:var(--gold); color:var(--indigo-deep); box-shadow:0 6px 0 var(--gold-dark);}
  .btn.secondary:active{box-shadow:0 2px 0 var(--gold-dark);}

  /* option grid */
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:10px;
  }
  .opt-btn{
    font-family:'Baloo 2', cursive;
    font-size:1.4rem;
    padding:20px 10px;
    border-radius:18px;
    border:3px solid #E7E7F0;
    background:#FAFAFD;
    color:var(--ink);
    cursor:pointer;
    transition:all .12s ease;
  }
  .opt-btn:hover{border-color:var(--gold); transform:translateY(-2px);}
  .opt-btn.correct{background:#E6F8EA; border-color:var(--grass); color:#2f7d43;}
  .opt-btn.wrong{background:#FFEAEE; border-color:var(--berry); color:#c23a58;}
  .opt-btn[disabled]{cursor:default; transform:none;}

  .opt-wide{grid-template-columns:1fr;}

  /* objects display */
  .objects{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-end;
    gap:14px 16px;
    background:#FBFBFE;
    border:2px dashed #E2E2ED;
    border-radius:18px;
    padding:20px 14px;
    margin:14px 0 18px 0;
  }
  .obj-item{
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    user-select:none;
    transition:transform .12s ease;
  }
  .obj-item:hover{ transform:scale(1.1); }
  .obj-item.tapped{ transform:scale(1.05); }
  .obj-emoji{ display:block; line-height:0; }
  .obj-emoji svg{ width:46px; height:46px; display:block; }
  .tap-label{
    font-family:'Baloo 2',cursive;
    font-size:1rem;
    font-weight:700;
    color:var(--gold-dark);
    min-height:18px;
  }
  .two-groups{
    display:flex;
    gap:14px;
    margin:14px 0 18px 0;
  }
  .group{
    flex:1;
    text-align:center;
    background:#FBFBFE;
    border:2px dashed #E2E2ED;
    border-radius:18px;
    padding:16px 8px;
  }
  .obj-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-end;
    gap:8px 10px;
  }
  .obj-row .obj-emoji svg{ width:34px; height:34px; }
  .obj-row .tap-label{ font-size:0.85rem; min-height:14px; }
  .group-label{font-family:'Baloo 2',cursive; margin-bottom:8px; color:#6b6f80;}

  .word-display{
    font-family:'Baloo 2',cursive;
    font-size:2.2rem;
    text-align:center;
    background:linear-gradient(135deg,var(--indigo),var(--indigo-mid));
    border-radius:18px;
    padding:22px 10px;
    margin:14px 0 18px 0;
    color:var(--gold-light);
    text-transform:capitalize;
  }

  .seq-display{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:14px 0 18px 0;
    flex-wrap:wrap;
  }
  .seq-item{
    width:52px; height:52px;
    display:flex; align-items:center; justify-content:center;
    border-radius:14px;
    font-family:'Baloo 2',cursive;
    font-size:1.5rem;
    background:#FBFBFE;
    border:2px solid #E2E2ED;
  }
  .seq-item.blank{
    background:var(--gold);
    color:var(--indigo-deep);
    border-color:var(--gold-dark);
  }

  .keypad{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin:14px 0 8px 0;
  }
  .key-btn{
    font-family:'Baloo 2',cursive;
    font-size:1.3rem;
    padding:14px 0;
    border-radius:14px;
    border:2px solid #E2E2ED;
    background:#FBFBFE;
    color:var(--ink);
    cursor:pointer;
  }
  .key-btn:hover{border-color:var(--gold);}
  .answer-box{
    text-align:center;
    font-family:'Baloo 2',cursive;
    font-size:2rem;
    min-height:52px;
    border-radius:14px;
    border:2px solid #E2E2ED;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
    color:var(--indigo);
  }

  .feedback{
    text-align:center;
    font-family:'Baloo 2',cursive;
    font-size:1.15rem;
    margin-top:14px;
    min-height:28px;
  }
  .feedback.correct{color:#2f7d43;}
  .feedback.wrong{color:#c23a58;}

  /* start & section intro */
  .center-icon{font-size:3.4rem; text-align:center; margin-bottom:8px;}
  .section-list{margin:16px 0; padding:0; list-style:none;}
  .section-list li{
    display:flex; align-items:center; gap:10px;
    padding:8px 0;
    color:#4a4e63;
  }
  .section-list .dot{
    width:26px;height:26px;border-radius:50%;
    background:#EDEDF3; color:#6b6f80;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',cursive; font-size:0.85rem; flex-shrink:0;
  }

  /* final score */
  .stars{text-align:center; font-size:2.6rem; margin:10px 0 4px 0;}
  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:18px 0;
  }
  .stat-box{
    background:#FBFBFE;
    border-radius:16px;
    padding:14px;
    text-align:center;
    border:2px solid #EDEDF3;
  }
  .stat-box .val{font-family:'Baloo 2',cursive; font-size:1.5rem; color:var(--indigo);}
  .stat-box .lbl{font-size:0.85rem; color:#6b6f80;}

  .obj-item{position:relative;}
  .obj-item.eaten .obj-emoji{opacity:.28; filter:grayscale(.85);}
  .obj-item.eaten::after{
    content:"✕"; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-62%);
    font-family:'Baloo 2',cursive; font-weight:800; font-size:1.9rem; line-height:1;
    color:#C23A58;
  }
  .obj-item.fixed{cursor:default;}
  .obj-item.fixed:hover{transform:none;}
  .eat-hint{text-align:center; font-family:'Baloo 2',cursive; color:#6b6f80; margin:-6px 0 14px;}
  .eat-hint b{color:var(--indigo); font-size:1.2rem;}
  .nl{display:flex; gap:4px; margin:14px 0 6px;}
  .nl-box{
    flex:1; min-width:0; aspect-ratio:1/1.1;
    display:flex; align-items:center; justify-content:center;
    border-radius:8px; border:2px solid #E2E2ED; background:#FBFBFE;
    font-family:'Baloo 2',cursive; font-size:0.95rem; color:var(--ink);
  }
  .nl-box.start{background:var(--gold); color:var(--indigo-deep); border-color:var(--gold-dark); font-weight:800;}
  .hop-line{text-align:center; font-family:'Baloo 2',cursive; color:#6b6f80; margin-bottom:16px;}
  .hop-line span{color:var(--gold-dark); margin-left:4px;}
  .nl-box{cursor:pointer; transition:transform .1s ease, background .15s ease;}
  .nl-box:hover{border-color:var(--gold);}
  .nl-box.passed{background:#FBEFC8; border-color:var(--gold);}
  .nl-box.here{background:var(--indigo); color:var(--gold-light); border-color:var(--gold); font-weight:800; transform:scale(1.12);}
  .nl-box.start:not(.here){background:var(--gold); color:var(--indigo-deep); border-color:var(--gold-dark);}
  .nl-box.pop{animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(1);}}
  .nl-status{text-align:center; font-family:'Baloo 2',cursive; color:#6b6f80; margin-bottom:10px; line-height:1.35;}
  .nl-status b{color:var(--indigo); font-size:1.1rem;}
  .why{background:#FFF3CF; border-left:6px solid var(--gold); border-radius:12px; padding:10px 14px; margin-bottom:16px; color:var(--ink);}
  .why summary{cursor:pointer; font-family:'Baloo 2',cursive; font-weight:700; color:var(--indigo);}
  .why p{margin:8px 0 0; line-height:1.45; font-size:.95rem;}
  .info-card{background:#FFF3CF; border-left:6px solid var(--gold); border-radius:12px; padding:12px 14px; margin:14px 0 18px; line-height:1.5; color:var(--ink);}
  .eq-num{cursor:pointer; border-bottom:3px dotted var(--gold); padding:0 4px; transition:transform .1s ease; display:inline-block;}
  .eq-num:hover{transform:scale(1.12);}
  .qty-panel{text-align:center; font-family:'Baloo 2',cursive; color:#6b6f80; min-height:44px; margin:-6px 0 14px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px;}
  .qty-panel b{color:var(--indigo); font-size:1.3rem;}
  .qty-dots{display:inline-flex; flex-wrap:wrap; gap:5px; justify-content:center;}
  .qty-dots i{width:16px; height:16px; border-radius:50%; background:var(--gold); border:2px solid var(--gold-dark); display:inline-block;}
  .obj-big{display:flex; flex-direction:column; align-items:center; cursor:pointer; background:#FBFBFE; border:2px dashed #E2E2ED; border-radius:18px; padding:14px; margin:14px 0 8px;}
  .obj-big svg{width:110px; height:110px;}
  .obj-name{font-family:'Baloo 2',cursive; margin-top:4px; color:var(--indigo); font-weight:700; text-transform:capitalize;}
  .ciri-panel{text-align:center; font-family:'Baloo 2',cursive; color:#6b6f80; min-height:44px; margin:0 0 14px; line-height:1.35;}
  .ciri-panel b{color:var(--indigo);}
  .riddle{background:linear-gradient(135deg,var(--indigo),var(--indigo-mid)); color:var(--gold-light); border-radius:18px; padding:20px 16px; margin:14px 0 18px; text-align:center; font-family:'Baloo 2',cursive; font-size:1.25rem; line-height:1.4;}
  .opt-btn.icon{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:1.05rem; padding:12px 6px;}
  .opt-btn.icon svg{width:64px; height:64px;}
  .options.three{grid-template-columns:1fr 1fr 1fr;}
  .obj-cap{font-family:'Baloo 2',cursive; font-size:.78rem; color:#6b6f80; text-align:center; max-width:70px; line-height:1.1;}
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 8px;}
  .lg{padding:6px 12px; border-radius:99px; font-family:'Baloo 2',cursive; font-size:.95rem; color:var(--ink);}
  .lg.l1{background:#FFF6D6; border:2px solid var(--gold);}
  .lg.l2{background:#E3EAF6; border:2px solid var(--indigo-mid);}
  .lg.l3{background:#E6F8EA; border:2px solid var(--grass);}
  .sort-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px; margin:14px 0 18px;}
  .sort-item{position:relative; border:3px solid #E2E2ED; background:#FBFBFE; border-radius:16px; padding:10px 4px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; font-family:'Baloo 2',cursive; font-size:.9rem; color:var(--ink);}
  .sort-item svg{width:56px; height:56px;}
  .sort-item .badge-g{position:absolute; top:-9px; right:-9px; width:26px; height:26px; border-radius:50%; display:none; align-items:center; justify-content:center; font-style:normal; font-weight:800; font-size:.95rem; color:#fff;}
  .sort-item.g1{border-color:var(--gold); background:#FFF6D6;}
  .sort-item.g2{border-color:var(--indigo-mid); background:#E3EAF6;}
  .sort-item.g3{border-color:var(--grass); background:#E6F8EA;}
  .sort-item.g1 .badge-g{display:flex; background:var(--gold); color:var(--indigo-deep);}
  .sort-item.g2 .badge-g{display:flex; background:var(--indigo-mid);}
  .sort-item.g3 .badge-g{display:flex; background:var(--grass);}
  .sort-item.right{box-shadow:0 0 0 3px var(--grass);}
  .sort-item.bad{box-shadow:0 0 0 3px var(--berry);}
  .comp{width:100%; max-width:320px; height:auto; display:block; margin:12px auto 6px; background:#FBFBFE; border:2px dashed #E2E2ED; border-radius:18px; padding:8px;}
  .comp.small{max-width:240px;}
  .part{cursor:pointer;}
  .part.sel{stroke:#D4AF37; stroke-width:4;}
  .pal{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0;}
  .pal-btn{border:3px solid #E2E2ED; background:#FBFBFE; border-radius:14px; padding:8px 2px; font-family:'Baloo 2',cursive; font-size:.78rem; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; color:var(--ink); line-height:1.1; text-align:center;}
  .pal-btn:hover{border-color:var(--gold);}
  .pal-btn svg{width:40px; height:40px;}
  .tray{min-height:62px; border:2px dashed var(--gold); border-radius:14px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; background:#FFFBEA;}
  .tray .hint{color:#9a9272; font-family:'Baloo 2',cursive; font-size:.9rem;}
  .chip{border:2px solid #E2E2ED; background:#fff; border-radius:10px; padding:2px; cursor:pointer;}
  .chip svg{width:36px; height:36px; display:block;}
  .frame{background:#FBFBFE; border:2px dashed #E2E2ED; border-radius:18px; padding:12px 8px; margin:12px 0 14px;}
  .row10{display:grid; grid-template-columns:repeat(10,1fr); gap:2px; margin-bottom:6px;}
  .row10:last-child{margin-bottom:0;}
  .f-item{cursor:pointer; display:flex; flex-direction:column; align-items:center; user-select:none; transition:transform .12s ease;}
  .f-item:hover{transform:scale(1.12);}
  .f-ico{display:block; width:100%; max-width:46px; line-height:0;}
  .f-ico svg{width:100%; height:auto; display:block;}
  .f-item .tap-label{font-size:.78rem; min-height:14px; line-height:1;}
  .track-cap{text-align:center; font-family:'Baloo 2',cursive; color:#6b6f80; font-size:.85rem; margin:10px 0 4px;}
  .track{display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin-bottom:14px;}
  .tr-box{font-family:'Baloo 2',cursive; font-size:.95rem; padding:6px 0; border-radius:8px; border:2px solid #E2E2ED; background:#FBFBFE; color:var(--ink); cursor:pointer;}
  .tr-box.mark{background:#FBEFC8; border-color:var(--gold);}
  .tr-box.start{background:var(--gold); color:var(--indigo-deep); border-color:var(--gold-dark); font-weight:800;}
  .tens-wrap{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:center; background:#FBFBFE; border:2px dashed #E2E2ED; border-radius:18px; padding:16px 10px; margin:12px 0 8px;}
  .bundles{display:flex; gap:12px; flex-wrap:wrap;}
  .ikat{cursor:pointer; border:3px solid var(--gold); background:#FFFBEA; border-radius:14px; padding:6px; text-align:center; position:relative;}
  .ikat::after{content:""; position:absolute; left:-4px; right:-4px; top:50%; height:7px; background:var(--gold-dark); border-radius:4px; opacity:.85; transform:translateY(-50%);}
  .ikat-grid{display:grid; grid-template-columns:repeat(5,28px); gap:2px;}
  .mini{display:block; line-height:0;}
  .mini svg{width:28px; height:28px; display:block;}
  .ikat-lbl{font-family:'Baloo 2',cursive; font-size:.85rem; color:var(--gold-dark); margin-top:4px;}
  .ikat.open{background:#FFF3CF;}
  .loose{display:flex; flex-wrap:wrap; gap:6px; max-width:100%;}
  .loose .f-ico{width:40px;}
  .o-tiles{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:14px 0;}
  .o-tile{position:relative; min-width:76px; font-family:'Baloo 2',cursive; font-size:1.8rem; padding:14px 18px; border-radius:16px; border:3px solid #E2E2ED; background:#FBFBFE; color:var(--ink); cursor:pointer;}
  .o-tile.picked{border-color:var(--gold); background:#FFF6D6;}
  .o-pos{position:absolute; top:-9px; right:-9px; min-width:24px; height:24px; border-radius:50%; background:var(--gold); color:var(--indigo-deep); font-size:.9rem; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .o-tile:not(.picked) .o-pos{display:none;}
  .chip-num{font-family:'Baloo 2',cursive; font-size:1.4rem; background:#fff; border:2px solid var(--gold); border-radius:10px; padding:2px 12px; color:var(--indigo);}
  .tray .arrow{color:var(--gold-dark); font-size:1.4rem;}
  @media (max-width:420px){
    .card{padding:24px 18px;}
    h1{font-size:1.5rem;}
    .opt-btn{font-size:1.15rem; padding:16px 8px;}
  }
</style>
</head>

  { name:'edelweiss', svg: svgW(rot(8,24,24,(a)=>`<ellipse cx="24" cy="11" rx="3.6" ry="9.5" fill="#F4F4EE" stroke="#B0B09E" stroke-width="1.5" transform="rotate(${a} 24 24)"/>`) + `<circle cx="24" cy="24" r="6.2" fill="#F2C94C" stroke="#C9A93A" stroke-width="1.4"/><g fill="#C9A93A"><circle cx="22" cy="23" r="1"/><circle cx="26" cy="22" r="1"/><circle cx="24" cy="27" r="1"/></g>`) },
  { name:'teratai', svg: svgW(`<ellipse cx="24" cy="41" rx="20" ry="5.5" fill="#5FAE5B" stroke="#3D7C3A" stroke-width="1.8"/><ellipse cx="24" cy="25" rx="5" ry="12" fill="#F8B6CE" stroke="#C2527E" stroke-width="1.6" transform="rotate(-62 24 36)"/><ellipse cx="24" cy="25" rx="5" ry="12" fill="#F8B6CE" stroke="#C2527E" stroke-width="1.6" transform="rotate(62 24 36)"/><ellipse cx="24" cy="24" rx="5.2" ry="13" fill="#F8A5C2" stroke="#C2527E" stroke-width="1.6" transform="rotate(-32 24 36)"/><ellipse cx="24" cy="24" rx="5.2" ry="13" fill="#F8A5C2" stroke="#C2527E" stroke-width="1.6" transform="rotate(32 24 36)"/><ellipse cx="24" cy="22" rx="5.4" ry="14" fill="#FBC3D8" stroke="#C2527E" stroke-width="1.6"/>`) },
  { name:'pisang', svg: svgW(`<g fill="#F4D03F" stroke="#A88A13" stroke-width="1.8" stroke-linejoin="round"><path d="M8 12 Q8 38 34 42 Q18 33 17 12 Z"/><path d="M14 10 Q15 35 39 38 Q26 30 24 10 Z"/><path d="M21 8 Q23 32 44 33 Q33 26 30 8 Z"/></g><rect x="6" y="6" width="9" height="7" rx="2" fill="#7A5A2A"/>`) },
  { name:'daun jati', svg: svgW(`<path d="M24 4 Q46 16 41 34 Q33 46 24 44 Q8 40 8 26 Q8 12 24 4Z" fill="#7CB342" stroke="#3F6E1D" stroke-width="2" stroke-linejoin="round"/><path d="M24 44 V8 M24 36 L14 30 M24 28 L12 22 M24 20 L16 15 M24 36 L34 30 M24 28 L36 22 M24 20 L32 15" stroke="#3F6E1D" stroke-width="1.4" fill="none"/>`) }
];
const WORDS = ['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas','dua belas','tiga belas','empat belas','lima belas','enam belas','tujuh belas','delapan belas','sembilan belas','dua puluh'];

function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0, arr.length-1)]; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = randInt(0,i);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function uniqueOptionsAround(correct, min, max, count){
  const set = new Set([correct]);
  let guard = 0;
  while(set.size < count && guard < 400){
    guard++;
    let v = correct + randInt(-4,4);
    if(v < min) v = min + randInt(0,2);
    if(v > max) v = max - randInt(0,2);
    set.add(v);
  }
  return shuffle(Array.from(set));
}
function distinctNums(count, min, max){
  const s = new Set();
  while(s.size < count) s.add(randInt(min,max));
  return Array.from(s);
}
function esc(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- visual helpers ---------- */
function countTap(el, g){
  g = g || 'n';
  if(el.dataset.tapped) return;
  if(!game.tapCounters) game.tapCounters = {};
  game.tapCounters[g] = (game.tapCounters[g] || 0) + 1;
  el.dataset.tapped = '1';
  el.classList.add('tapped');
  el.querySelector('.tap-label').textContent = game.tapCounters[g];
}
// benda ditata 10 per baris
function floraGrid(svg, n, group){
  const item = `<span class="f-item" onclick="countTap(this,'${group||'n'}')"><span class="f-ico">${svg}</span><span class="tap-label"></span></span>`;
  const rows = [];
  for(let s=0; s<n; s+=10) rows.push(`<div class="row10">${Array(Math.min(10,n-s)).fill(item).join('')}</div>`);
  return `<div class="frame">${rows.join('')}</div>`;
}
function trackHtml(start){
  let h = '<div class="track-cap">Jalur angka (boleh dipencet untuk menandai)</div><div class="track">';
  for(let i=1;i<=20;i++) h += `<button class="tr-box${i===start?' start':''}" onclick="trackTap(this)">${i}</button>`;
  return h + '</div>';
}
function trackTap(el){ el.classList.toggle('mark'); }
function seqHtml(seq, hiddenIndex){
  return '<div class="seq-display">' + seq.map((v,i)=> i===hiddenIndex ? '<div class="seq-item blank">?</div>' : `<div class="seq-item">${v}</div>`).join('') + '</div>';
}
function eqBox(text){ return `<div class="word-display">${text}</div>`; }
// nilai tempat: ikat berisi 10 + benda lepas
function tensVisual(n, svg){
  const t = Math.floor(n/10), o = n%10;
  const mini = Array(10).fill(`<span class="mini">${svg}</span>`).join('');
  const bundles = Array(t).fill(`<div class="ikat" onclick="ikatTap(this)"><div class="ikat-grid">${mini}</div><div class="ikat-lbl">1 ikat</div></div>`).join('');
  const loose = Array(o).fill(`<span class="f-item" onclick="countTap(this,'o')"><span class="f-ico">${svg}</span><span class="tap-label"></span></span>`).join('');
  return `<div class="tens-wrap"><div class="bundles">${bundles}</div><div class="loose">${loose}</div></div><div class="ciri-panel" id="nilaiPanel">Pencet ikat untuk melihat isinya. Pencet benda lepas untuk menghitungnya.</div>`;
}
function ikatTap(el){
  el.classList.add('open');
  el.querySelector('.ikat-lbl').textContent = '10 buah';
  const p = document.getElementById('nilaiPanel');
  if(p) p.innerHTML = 'Satu ikat berisi <b>10</b> benda. Satu ikat sama dengan <b>1 puluhan</b>.';
}

/* ============ QUESTION GENERATORS ============ */
// A. Menghitung, Membaca, dan Menulis Bilangan
function genCountChoice(){
  const n = randInt(11,20), f = pick(FLORA);
  return {
    type:'choice',
    prompt:`Ada berapa ${f.name} di bawah ini? (pencet tiap benda untuk menghitung)`,
    visual: floraGrid(f.svg, n),
    options: uniqueOptionsAround(n,1,20,4), correct:n
  };
}
function genReadWord(){
  const n = randInt(11,20), f = pick(FLORA);
  return {
    type:'choice',
    prompt:'Pilih angka yang sesuai dengan tulisan ini: (pencet benda untuk membantu menghitung)',
    visual: `<div class="word-display">${WORDS[n]}</div>` + floraGrid(f.svg, n),
    options: uniqueOptionsAround(n,11,20,4), correct:n
  };
}
function genWriteNumber(){
  const n = randInt(11,20), f = pick(FLORA);
  return {
    type:'input',
    prompt:`Hitung ${f.name} di bawah ini lalu ketik jumlahnya.`,
    visual: floraGrid(f.svg, n),
    correct:n
  };
}
function genNumberToWord(){
  const n = randInt(11,20);
  const nums = uniqueOptionsAround(n,11,20,4);
  return {
    type:'choice',
    prompt:`Bilangan ${n} dibaca ...`,
    visual: eqBox(String(n)),
    options: nums.map(v=>WORDS[v]), correct: WORDS[n]
  };
}
function buildSectionA(){
  return [genCountChoice(), genReadWord(), genWriteNumber(), genNumberToWord()];
}

// B. Menghitung Maju dan Mundur
function makeSeq(){
  const forward = Math.random() < 0.5;
  let seq;
  if(forward){ const s = randInt(11,16); seq = [s,s+1,s+2,s+3,s+4]; }
  else { const s = randInt(15,20); seq = [s,s-1,s-2,s-3,s-4]; }
  const hi = randInt(0,4);
  return { forward, seq, hi, answer: seq[hi] };
}
function genSeqChoice(){
  const q = makeSeq();
  return {
    type:'choice',
    prompt: q.forward ? 'Lengkapi urutan bilangan (maju):' : 'Lengkapi urutan bilangan (mundur):',
    visual: seqHtml(q.seq,q.hi) + trackHtml(),
    options: uniqueOptionsAround(q.answer,10,20,4), correct:q.answer
  };
}
function genNextPrev(){
  const after = Math.random() < 0.5;
  const n = after ? randInt(11,19) : randInt(12,20);
  const ans = after ? n+1 : n-1;
  return {
    type:'choice',
    prompt:`Bilangan ${after?'setelah':'sebelum'} ${n} adalah ...`,
    visual: trackHtml(),
    options: uniqueOptionsAround(ans,10,20,4), correct:ans
  };
}
function genSeqInput(){
  const q = makeSeq();
  return {
    type:'input',
    prompt: q.forward ? 'Ketik bilangan yang hilang (maju):' : 'Ketik bilangan yang hilang (mundur):',
    visual: seqHtml(q.seq,q.hi) + trackHtml(),
    correct:q.answer
  };
}
function genHop(){
  const forward = Math.random() < 0.5;
  const k = randInt(2,5);
  const s = forward ? randInt(11,20-k) : randInt(11+k,20);
  const ans = forward ? s+k : s-k;
  return {
    type:'choice',
    prompt:`Mulai dari ${s} (kotak emas). Melangkah ${forward?'maju':'mundur'} ${k} kali. Berhenti di angka berapa?`,
    visual: trackHtml(s),
    options: uniqueOptionsAround(ans,10,20,4), correct:ans
  };
}
function buildSectionB(){
  return [genSeqChoice(), genNextPrev(), genSeqInput(), genHop()];
}

// C. Nilai Tempat
function tensText(t,o){ return `${t} puluhan dan ${o} satuan`; }
function genTensChoice(){
  const n = randInt(11,19), o = n-10, f = pick(FLORA);
  const correct = tensText(1,o);
  const cands = shuffle([tensText(o,1), tensText(1, o<9?o+1:o-1), tensText(2,o), tensText(0,n), tensText(1, o>1?o-1:o+2)]);
  const set = new Set([correct]);
  cands.forEach(c=>{ if(set.size<4) set.add(c); });
  return {
    type:'choiceWide',
    prompt:`Ada berapa puluhan dan berapa satuan pada gambar ini?`,
    visual: tensVisual(n,f.svg),
    options: shuffle(Array.from(set)), correct
  };
}
function genComposeNumber(){
  const n = randInt(11,19), o = n-10;
  const cands = shuffle([o, n+1<=20?n+1:n-2, n-1, 10, 20].filter(v=>v!==n));
  const set = new Set([n]);
  cands.forEach(c=>{ if(set.size<4) set.add(c); });
  return {
    type:'choice',
    prompt:'Berapa bilangan yang terbentuk?',
    visual: eqBox(`1 puluhan + ${o} satuan = ?`),
    options: shuffle(Array.from(set)), correct:n
  };
}
function genTensInput(){
  const n = randInt(11,19), o = n-10, f = pick(FLORA);
  return {
    type:'input',
    prompt:`${n} = 1 puluhan + ... satuan. Ketik banyaknya satuan.`,
    visual: tensVisual(n,f.svg),
    correct:o
  };
}
function genDigitValue(){
  const n = randInt(11,19), o = n-10;
  const tensDigit = Math.random() < 0.5;
  const d = tensDigit ? 1 : o;
  const correct = tensDigit ? 10 : o;
  const set = new Set([correct]);
  [d, n, tensDigit ? o : 10, 1, 2, 5].forEach(v=>{ if(set.size<4 && v>=1) set.add(v); });
  let g = 0; while(set.size<4 && g++<50) set.add(randInt(1,19));
  return {
    type:'choice',
    prompt:`Pada bilangan ${n}, angka ${d} di ${tensDigit?'tempat puluhan':'tempat satuan'} bernilai ...`,
    visual: eqBox(String(n)),
    options: shuffle(Array.from(set)), correct
  };
}
function buildSectionC(){
  return [genTensChoice(), genComposeNumber(), genTensInput(), genDigitValue()];
}

// D. Membandingkan Bilangan
function genCompareSymbol(){
  const a = randInt(1,20);
  let b = Math.random() < 0.2 ? a : randInt(1,20);
  const correct = a>b ? '>' : (a<b ? '<' : '=');
  return {
    type:'choice',
    prompt:'Pilih tanda yang tepat. Mulut tanda selalu menghadap bilangan yang lebih besar.',
    visual: eqBox(`${a} ... ${b}`) + trackHtml(),
    options: ['>','<','='], correct
  };
}
function genCompareGroups(){
  const a = randInt(6,20);
  const b = Math.random() < 0.2 ? a : randInt(6,20);
  const fl = pick(FLORA);
  let fr = pick(FLORA); if(fr.name === fl.name) fr = pick(FLORA.filter(x=>x.name!==fl.name));
  const options = ['Kiri lebih banyak','Kanan lebih banyak','Sama banyak'];
  const correct = a>b ? options[0] : (b>a ? options[1] : options[2]);
  return {
    type:'choiceWide',
    prompt:'Kelompok mana yang lebih banyak? (pencet benda untuk menghitung)',
    visual: `<div class="group-label">Kiri</div>${floraGrid(fl.svg,a,'left')}<div class="group-label" style="margin-top:10px;">Kanan</div>${floraGrid(fr.svg,b,'right')}`,
    options, correct
  };
}
function genOrder(){
  const asc = Math.random() < 0.7;
  const items = distinctNums(randInt(3,4),1,20);
  const expected = items.slice().sort((x,y)=> asc ? x-y : y-x);
  return {
    type:'order',
    prompt:`Urutkan bilangan dari yang ${asc?'terkecil sampai terbesar':'terbesar sampai terkecil'}. Pencet bilangan sesuai urutannya.`,
    items: shuffle(items), expected, correctDesc: expected.join(', ')
  };
}
function genExtreme(){
  const big = Math.random() < 0.5;
  const nums = distinctNums(4,1,20);
  const correct = big ? Math.max(...nums) : Math.min(...nums);
  return {
    type:'choice',
    prompt:`Mana bilangan yang paling ${big?'besar':'kecil'}?`,
    visual: trackHtml(),
    options: shuffle(nums), correct
  };
}
function buildSectionD(){
  return [genCompareSymbol(), genCompareGroups(), genOrder(), genExtreme()];
}

const SECTIONS = [
  { key:'A', title:'Menghitung, Membaca, dan Menulis Bilangan', icon:'🌸', build:buildSectionA },
  { key:'B', title:'Menghitung Maju dan Mundur', icon:'🔢', build:buildSectionB },
  { key:'C', title:'Nilai Tempat', icon:'🌿', build:buildSectionC },
  { key:'D', title:'Membandingkan Bilangan', icon:'⚖️', build:buildSectionD },
];

/* ============ GAME STATE ============ */
let game = null;

function newGame(){
  const sections = SECTIONS.map(s => ({...s, questions: s.build()}));
  const totalQuestions = sections.reduce((sum,s)=>sum+s.questions.length,0);
  return {
    sections,
    totalQuestions,
    sectionIndex: 0,
    questionIndex: 0,
    correct: 0,
    wrong: 0,
    times: [],
    startedAt: null,
    qStartedAt: null,
    currentInput: ''
  };
}

const app = document.getElementById('app');

/* ============ RENDER: START SCREEN ============ */
function renderStart(){
  app.innerHTML = `
    <div class="center-icon">🌺🌿🌺</div>
    <h1>Ayo Membilang sampai dengan 20</h1>
    <p class="muted">Bab 5 — Petualangan Angka untuk Kelas 1 SD</p>
    <ul class="section-list">
      ${SECTIONS.map(s=>`<li><span class="dot">${s.key}</span> ${s.icon} ${s.title}</li>`).join('')}
    </ul>
    <button class="btn big" onclick="startGame()">Mulai Bermain 🚀</button>
  `;
}

function startGame(){
  game = newGame();
  game.startedAt = Date.now();
  showSectionIntro();
}

/* ============ RENDER: SECTION INTRO ============ */
function sectionTip(key){
  if(key === 'A') return `<div class="info-card"><b>Tahukah kamu?</b><br>Bilangan 11 sampai 20 dibaca: sebelas, dua belas, tiga belas, dan seterusnya sampai dua puluh. Hitung bendanya satu per satu, ya.</div>`;
  if(key === 'B') return `<div class="info-card"><b>Tahukah kamu?</b><br>Menghitung maju berarti bilangannya bertambah satu-satu ke kanan. Menghitung mundur berarti berkurang satu-satu ke kiri.</div>`;
  if(key === 'C') return `<div class="info-card"><b>Tahukah kamu?</b><br>Satu ikat berisi 10 benda, namanya 1 puluhan. Contoh: 14 adalah 1 puluhan dan 4 satuan.</div>`;
  if(key === 'D') return `<div class="info-card"><b>Tahukah kamu?</b><br>Tanda &gt; berarti lebih besar, &lt; berarti lebih kecil, dan = berarti sama. Mulut tanda selalu menghadap bilangan yang lebih besar.</div>`;
  return '';
}
function showSectionIntro(){
  const s = game.sections[game.sectionIndex];
  app.innerHTML = `
    <div class="center-icon">${s.icon}</div>
    <h2>Bagian ${s.key}</h2>
    <p>${s.title}</p>
    <p class="muted">Ada ${s.questions.length} soal di bagian ini. Semangat ya!</p>
    ${sectionTip(s.key)}
    <button class="btn big secondary" onclick="showQuestion()">Ayo Mulai ✏️</button>
  `;
}

/* ============ RENDER: PROGRESS BAR ============ */
function renderProgress(){
  let doneCount = 0;
  for(let i=0;i<game.sectionIndex;i++) doneCount += game.sections[i].questions.length;
  doneCount += game.questionIndex;
  const pct = Math.round((doneCount / game.totalQuestions)*100);
  const badges = SECTIONS.map((s,i)=>{
    let cls='badge';
    if(i < game.sectionIndex) cls += ' done';
    else if(i === game.sectionIndex) cls += ' active';
    return `<div class="${cls}">${s.key}</div>`;
  }).join('');
  return `
    <div class="progress-wrap">
      <div class="badges">${badges}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="qcount">${doneCount}/${game.totalQuestions}</div>
    </div>
  `;
}

/* ============ RENDER: QUESTION ============ */
function showQuestion(){
  const s = game.sections[game.sectionIndex];
  const q = s.questions[game.questionIndex];
  game.qStartedAt = Date.now();
  game.currentInput = '';
  game.tapCounters = {};
  game.locked = false;
  game.sortState = null;
  game.tray = [];
  game.orderPicked = [];

  let body = '';
  if(q.type === 'choice' || q.type === 'choiceWide'){
    const gridClass = q.type === 'choiceWide' ? 'options opt-wide' : 'options';
    body = `
      ${q.visual || ''}
      <div class="${gridClass}" id="opts">
        ${q.options.map((opt,i)=>`<button class="opt-btn" onclick="answerChoice(this, ${i})">${esc(opt)}</button>`).join('')}
      </div>
    `;
  } else if(q.type === 'choiceIcon'){
    const cls = q.options.length === 3 ? 'options three' : 'options';
    body = `
      ${q.visual || ''}
      <div class="${cls}" id="opts">
        ${q.options.map((o,i)=>`<button class="opt-btn icon" onclick="answerChoice(this, ${i})">${o.svg}<span>${o.name}</span></button>`).join('')}
      </div>
    `;
  } else if(q.type === 'input'){
    body = `
      ${q.visual || ''}
      <div class="answer-box" id="answerBox">&nbsp;</div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="key-btn" onclick="pressKey(${n})">${n}</button>`).join('')}
      </div>
      <button class="btn big" style="margin-top:12px;" onclick="submitInput()">Cek Jawaban ✅</button>
      <button class="btn" style="background:#E4DDC8;color:var(--indigo-deep);box-shadow:0 6px 0 #C3B992;margin-top:8px;" onclick="clearInput()">Hapus</button>
    `;
  } else if(q.type === 'order'){
    body = `
      <div class="o-tiles">${q.items.map((v,i)=>`<button class="o-tile" onclick="orderTap(${i})">${v}<span class="o-pos"></span></button>`).join('')}</div>
      <div class="tray" id="orderTray"></div>
      <button class="btn big" onclick="submitOrder()">Cek Jawaban ✅</button>
      <button class="btn" style="background:#E4DDC8;color:var(--indigo-deep);box-shadow:0 6px 0 #C3B992;margin-top:8px;" onclick="orderClear()">Hapus Semua</button>
    `;
  } else if(q.type === 'sort'){
    game.sortState = Array(q.items.length).fill(0);
    const legend = q.groups.map((g,i)=>`<span class="lg l${i+1}">${i+1}. ${g}</span>`).join('');
    const items = q.items.map((it,i)=>`<button class="sort-item" id="si${i}" onclick="sortTap(${i})">${it.svg}<span>${it.name}</span><i class="badge-g"></i></button>`).join('');
    body = `
      <div class="legend">${legend}</div>
      <div class="sort-grid">${items}</div>
      <button class="btn big" onclick="submitSort()">Cek Jawaban ✅</button>
    `;
  } else if(q.type === 'build'){
    body = `
      ${q.visual}
      <div class="pal">${FLAT.map(f=>`<button class="pal-btn" onclick="buildAdd('${f}')">${flatIcon(f)}<span>${f}</span></button>`).join('')}</div>
      <div class="tray" id="tray"></div>
      <button class="btn big" onclick="submitBuild()">Cek Jawaban ✅</button>
      <button class="btn" style="background:#E4DDC8;color:var(--indigo-deep);box-shadow:0 6px 0 #C3B992;margin-top:8px;" onclick="buildClear()">Hapus Semua</button>
    `;
  }

  app.innerHTML = `
    ${renderProgress()}
    <h3>${q.prompt}</h3>
    ${body}
    <div class="feedback" id="feedback"></div>
  `;
  if(q.type === 'build') renderTray();
  if(q.type === 'order') renderOrder();
}

function pressKey(n){
  if(game.locked) return;
  if(game.currentInput.length >= 2) return;
  game.currentInput += String(n);
  document.getElementById('answerBox').textContent = game.currentInput;
}
function clearInput(){
  if(game.locked) return;
  game.currentInput = '';
  document.getElementById('answerBox').innerHTML = '&nbsp;';
}
function submitInput(){
  if(game.locked || game.currentInput === '') return;
  const s = game.sections[game.sectionIndex];
  const q = s.questions[game.questionIndex];
  const val = parseInt(game.currentInput, 10);
  finishAnswer(val === q.correct, `${q.correct}`, val);
}

function optVal(o){ return (o && typeof o === 'object') ? o.name : o; }
function answerChoice(btn, idx){
  if(game.locked) return;
  const s = game.sections[game.sectionIndex];
  const q = s.questions[game.questionIndex];
  const chosen = optVal(q.options[idx]);
  const opts = document.querySelectorAll('#opts .opt-btn');
  opts.forEach(b=> b.disabled = true);
  const isCorrect = String(chosen) === String(q.correct);
  if(isCorrect){
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    opts.forEach((b,i)=>{ if(String(optVal(q.options[i])) === String(q.correct)) b.classList.add('correct'); });
  }
  finishAnswer(isCorrect, q.correct, chosen);
}

/* ---------- mengelompokkan benda ---------- */
function sortRender(){
  document.querySelectorAll('.sort-item').forEach((el,i)=>{
    const st = game.sortState[i];
    el.className = 'sort-item' + (st ? ' g'+st : '');
    el.querySelector('.badge-g').textContent = st || '';
  });
}
function sortTap(i){
  if(game.locked || !game.sortState) return;
  const q = game.sections[game.sectionIndex].questions[game.questionIndex];
  game.sortState[i] = (game.sortState[i] + 1) % (q.groups.length + 1);
  sortRender();
}
function submitSort(){
  if(game.locked) return;
  const q = game.sections[game.sectionIndex].questions[game.questionIndex];
  if(game.sortState.some(v=>v===0)){
    const fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.textContent = 'Masukkan semua benda ke kelompok dulu ya.';
    return;
  }
  const marks = q.items.map((it,i)=> game.sortState[i] === it.group+1);
  document.querySelectorAll('.sort-item').forEach((el,i)=> el.classList.add(marks[i] ? 'right' : 'bad'));
  finishAnswer(marks.every(Boolean), q.correctDesc, null);
}

/* ---------- menyusun bentuk ---------- */
function renderTray(){
  const t = document.getElementById('tray');
  if(!t) return;
  t.innerHTML = game.tray.length
    ? game.tray.map((f,i)=>`<button class="chip" onclick="buildRemove(${i})" title="${f}">${flatIcon(f)}</button>`).join('')
    : '<span class="hint">Pencet bentuk di atas, nanti muncul di sini. Pencet bentuk di sini untuk menghapusnya.</span>';
}
function buildAdd(f){
  if(game.locked || game.tray.length >= 8) return;
  game.tray.push(f); renderTray();
}
function buildRemove(i){
  if(game.locked) return;
  game.tray.splice(i,1); renderTray();
}
function buildClear(){
  if(game.locked) return;
  game.tray = []; renderTray();
}
function submitBuild(){
  if(game.locked || game.tray.length === 0) return;
  const q = game.sections[game.sectionIndex].questions[game.questionIndex];
  const ok = FLAT.every(f => game.tray.filter(x=>x===f).length === (q.recipe[f] || 0));
  finishAnswer(ok, q.correctDesc, null);
}

/* ---------- mengurutkan bilangan ---------- */
function renderOrder(){
  const q = game.sections[game.sectionIndex].questions[game.questionIndex];
  document.querySelectorAll('.o-tile').forEach((el,i)=>{
    const pos = game.orderPicked.indexOf(i);
    el.classList.toggle('picked', pos >= 0);
    el.querySelector('.o-pos').textContent = pos >= 0 ? (pos+1) : '';
  });
  const t = document.getElementById('orderTray');
  if(t) t.innerHTML = game.orderPicked.length
    ? game.orderPicked.map((idx,k)=>`<span class="chip-num">${q.items[idx]}</span>`).join('<span class="arrow">›</span>')
    : '<span class="hint">Pencet bilangan di atas, urutannya muncul di sini.</span>';
}
function orderTap(i){
  if(game.locked) return;
  const pos = game.orderPicked.indexOf(i);
  if(pos >= 0) game.orderPicked.splice(pos,1); else game.orderPicked.push(i);
  renderOrder();
}
function orderClear(){
  if(game.locked) return;
  game.orderPicked = []; renderOrder();
}
function submitOrder(){
  if(game.locked) return;
  const q = game.sections[game.sectionIndex].questions[game.questionIndex];
  if(game.orderPicked.length < q.items.length){
    const fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.textContent = 'Pilih semua bilangan dulu ya.';
    return;
  }
  const got = game.orderPicked.map(i=>q.items[i]);
  const ok = got.every((v,k)=> v === q.expected[k]);
  finishAnswer(ok, q.correctDesc, null);
}

function finishAnswer(isCorrect, correctVal, givenVal){
  if(game.locked) return;
  game.locked = true;
  const elapsed = Date.now() - game.qStartedAt;
  game.times.push(elapsed);
  if(isCorrect){ game.correct++; } else { game.wrong++; }

  const fb = document.getElementById('feedback');
  if(fb){
    fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
    fb.textContent = isCorrect ? 'Benar sekali! 🎉' : `Belum tepat. Jawaban: ${correctVal}`;
  }

  setTimeout(()=>{
    const s = game.sections[game.sectionIndex];
    if(game.questionIndex < s.questions.length - 1){
      game.questionIndex++;
      showQuestion();
    } else if(game.sectionIndex < game.sections.length - 1){
      game.sectionIndex++;
      game.questionIndex = 0;
      showSectionIntro();
    } else {
      showFinalScore();
    }
  }, isCorrect ? 1100 : 2400);
}

/* ============ RENDER: FINAL SCORE ============ */
function formatTime(ms){
  const totalSec = Math.round(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function showFinalScore(){
  const totalTime = Date.now() - game.startedAt;
  const avgTime = game.times.reduce((a,b)=>a+b,0) / game.times.length;
  const accuracy = Math.round((game.correct / game.totalQuestions) * 100);

  let starCount = 1;
  if(accuracy >= 90) starCount = 3;
  else if(accuracy >= 70) starCount = 2;
  else if(accuracy >= 50) starCount = 1;
  else starCount = 0;
  const starsHtml = '⭐'.repeat(starCount) + '☆'.repeat(3-starCount);

  let message = 'Terus berlatih ya, pasti bisa lebih baik!';
  if(accuracy >= 90) message = 'Luar biasa! Kamu jago berhitung! 🎉';
  else if(accuracy >= 70) message = 'Bagus sekali, sedikit lagi sempurna!';
  else if(accuracy >= 50) message = 'Kerja bagus, ayo latihan lagi!';

  app.innerHTML = `
    <div class="center-icon">🏆</div>
    <h2 style="text-align:center;">Selesai! Bab 5: Ayo Membilang sampai dengan 20</h2>
    <div class="stars">${starsHtml}</div>
    <p class="muted" style="text-align:center;">${message}</p>
    <div class="stats-grid">
      <div class="stat-box"><div class="val">${game.correct}</div><div class="lbl">Jawaban Benar</div></div>
      <div class="stat-box"><div class="val">${game.wrong}</div><div class="lbl">Jawaban Salah</div></div>
      <div class="stat-box"><div class="val">${accuracy}%</div><div class="lbl">Akurasi</div></div>
      <div class="stat-box"><div class="val">${formatTime(totalTime)}</div><div class="lbl">Waktu Total</div></div>
      <div class="stat-box" style="grid-column:1/3;"><div class="val">${(avgTime/1000).toFixed(1)} detik</div><div class="lbl">Rata-rata Kecepatan per Soal</div></div>
    </div>
    <button class="btn big" onclick="startGame()">Main Lagi 🔁</button>
  `;
}

/* ============ INIT ============ */
renderStart();
</script>
</body>

.card{background:var(--cream);border-radius:28px;box-shadow:var(--card-shadow);padding:40px 28px 32px 28px;position:relative;overflow:hidden;border:1px solid rgba(212,175,55,0.35)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(45deg,var(--gold) 0px,var(--gold) 8px,var(--indigo) 8px,var(--indigo) 16px)}
.card::after{content:"";position:absolute;bottom:-50px;left:-50px;width:150px;height:150px;border:10px solid var(--gold);opacity:0.08;border-radius:50%}
h1,h2,h3{font-family:'Baloo 2',cursive;margin:0 0 8px 0;color:var(--ink)}

h2{font-size:1.5rem}
p{line-height:1.5}
.muted{color:#6b6f80}
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.badges{display:flex;gap:6px}
.badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:700;font-size:0.9rem;background:#EDE7D6;color:#a39a7c;border:2px solid transparent}
.badge.active{background:var(--indigo);color:var(--gold-light);border-color:var(--gold)}
.badge.done{background:var(--gold);color:var(--indigo-deep)}
.bar-track{flex:1;height:12px;background:#EDE7D6;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));border-radius:99px;transition:width .35s ease}
.qcount{font-family:'Baloo 2',cursive;font-size:0.95rem;color:#6b6f80;white-space:nowrap}
.btn{font-family:'Baloo 2',cursive;font-size:1.05rem;border:none;border-radius:16px;padding:14px 22px;cursor:pointer;color:var(--gold-light);background:var(--indigo);box-shadow:0 6px 0 var(--indigo-deep);transition:transform .08s ease}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--indigo-deep)}
.btn.big{width:100%;font-size:1.2rem;padding:18px}
.btn.secondary{background:var(--gold);color:var(--indigo-deep);box-shadow:0 6px 0 var(--gold-dark)}
.btn.secondary:active{box-shadow:0 2px 0 var(--gold-dark)}
.btn-link{display:block;text-align:center;margin-top:18px;font-family:'Baloo 2',cursive;font-size:1rem;color:var(--indigo);text-decoration:underline}
.note{font-size:0.9rem;color:#8a5a14;background:#FFF4D6;border-radius:12px;padding:8px 12px;margin:12px 0}
:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.opt-btn{font-family:'Baloo 2',cursive;font-size:1.4rem;padding:20px 10px;border-radius:18px;border:3px solid #E7E7F0;background:#FAFAFD;color:var(--ink);cursor:pointer;transition:all .12s ease}
.opt-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.opt-btn.correct{background:#E6F8EA;border-color:var(--grass);color:#2f7d43}
.opt-btn.wrong{background:#FFEAEE;border-color:var(--berry);color:#c23a58}
.opt-btn[disabled]{cursor:default;transform:none}
.opt-wide{grid-template-columns:1fr}
.objects{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:14px 16px;background:#FBFBFE;border:2px dashed #E2E2ED;border-radius:18px;padding:20px 14px;margin:14px 0 18px 0}
.obj-item{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;transition:transform .12s ease}

.obj-item.tapped{transform:scale(1.05)}
.obj-emoji{display:block;line-height:0}

.tap-label{font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;color:var(--gold-dark);min-height:18px}
.two-groups{display:flex;gap:14px;margin:14px 0 18px 0}
.group{flex:1;text-align:center;background:#FBFBFE;border:2px dashed #E2E2ED;border-radius:18px;padding:16px 8px}
.obj-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:8px 10px}
.obj-row .obj-emoji svg{width:34px;height:34px}
.obj-row .tap-label{font-size:0.85rem;min-height:14px}
.group-label{font-family:'Baloo 2',cursive;margin-bottom:8px;color:#6b6f80}
.word-display{font-family:'Baloo 2',cursive;font-size:2.2rem;text-align:center;background:linear-gradient(135deg,var(--indigo),var(--indigo-mid));border-radius:18px;padding:22px 10px;margin:14px 0 18px 0;color:var(--gold-light);text-transform:capitalize}
.seq-display{display:flex;justify-content:center;gap:10px;margin:14px 0 18px 0;flex-wrap:wrap}
.seq-item{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-family:'Baloo 2',cursive;font-size:1.5rem;background:#FBFBFE;border:2px solid #E2E2ED}
.seq-item.blank{background:var(--gold);color:var(--indigo-deep);border-color:var(--gold-dark)}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 8px 0}
.key-btn{font-family:'Baloo 2',cursive;font-size:1.3rem;padding:14px 0;border-radius:14px;border:2px solid #E2E2ED;background:#FBFBFE;color:var(--ink);cursor:pointer}
.key-btn:hover{border-color:var(--gold)}
.answer-box{text-align:center;font-family:'Baloo 2',cursive;font-size:2rem;min-height:52px;border-radius:14px;border:2px solid #E2E2ED;display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--indigo)}
.feedback{text-align:center;font-family:'Baloo 2',cursive;font-size:1.15rem;margin-top:14px;min-height:28px}
.feedback.correct{color:#2f7d43}

.center-icon{font-size:3.4rem;text-align:center;margin-bottom:8px}
.section-list{margin:16px 0;padding:0;list-style:none}

.section-list .dot{width:26px;height:26px;border-radius:50%;background:#EDEDF3;color:#6b6f80;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:0.85rem;flex-shrink:0}

<body>
<div class="batik-layer" aria-hidden="true"></div>
<div class="stage">
  <div class="card" id="app"></div>
</div>

<script src="../shared.js"></script>
<script>
/* ============ DATA & HELPERS ============ */
const HUB_URL = "../index.html?kelas=1";
const LOCAL_OBJECTS = [
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><ellipse cx="24" cy="12" rx="14" ry="5" fill="#F1DDA0" stroke="#7a4a1e" stroke-width="2"/><path d="M10 12 Q6 24 10 36 Q24 44 38 36 Q42 24 38 12 Q24 19 10 12Z" fill="#B5651D" stroke="#7a4a1e" stroke-width="2"/><path d="M12 19 L24 27 L36 19 M12 31 L24 39 L36 31" stroke="#F1DDA0" stroke-width="2" fill="none"/></svg>`,
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-35 24 24)"><rect x="2" y="19" width="44" height="10" rx="5" fill="#D9A441" stroke="#8a5a14" stroke-width="2"/><rect x="9" y="19" width="3" height="10" fill="#8a5a14"/><rect x="38" y="19" width="3" height="10" fill="#8a5a14"/><circle cx="18" cy="24" r="1.8" fill="#4a2f08"/><circle cx="24" cy="24" r="1.8" fill="#4a2f08"/><circle cx="30" cy="24" r="1.8" fill="#4a2f08"/></g></svg>`,
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M12 4 L24 11 L36 4" stroke="#5a3a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="24" cy="28" r="16" fill="#D4AF37" stroke="#8a6a14" stroke-width="2.5"/><circle cx="24" cy="28" r="11" fill="none" stroke="#A9822A" stroke-width="1.5"/><circle cx="24" cy="28" r="5.5" fill="#A9822A" stroke="#8a6a14" stroke-width="1.5"/></svg>`,
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M22 46 Q20 26 32 6" stroke="#6b8e23" stroke-width="2.5" fill="none" stroke-linecap="round"/><g fill="#E3B93C" stroke="#9a7514" stroke-width="1.2"><ellipse cx="32" cy="10" rx="3" ry="5.5" transform="rotate(20 32 10)"/><ellipse cx="27" cy="14" rx="3" ry="5.5" transform="rotate(-30 27 14)"/><ellipse cx="34" cy="18" rx="3" ry="5.5" transform="rotate(35 34 18)"/><ellipse cx="26" cy="22" rx="3" ry="5.5" transform="rotate(-35 26 22)"/><ellipse cx="32" cy="27" rx="3" ry="5.5" transform="rotate(35 32 27)"/><ellipse cx="24" cy="30" rx="3" ry="5.5" transform="rotate(-35 24 30)"/></g></svg>`,
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="26" r="16" fill="#7b4a26" stroke="#4a2a12" stroke-width="2.5"/><circle cx="18" cy="22" r="2.4" fill="#2b170a"/><circle cx="30" cy="22" r="2.4" fill="#2b170a"/><ellipse cx="24" cy="31" rx="2.6" ry="3.2" fill="#2b170a"/><path d="M14 16 Q18 11 24 11" stroke="#a8703f" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`,
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="5" width="12" height="6" rx="2" fill="#D4AF37" stroke="#8a6a14" stroke-width="1.5"/><rect x="10" y="10" width="28" height="28" rx="12" fill="#D9382E" stroke="#8f1d16" stroke-width="2"/><path d="M24 10 V38 M17 11 Q13 24 17 37 M31 11 Q35 24 31 37" stroke="#F1DDA0" stroke-width="1.5" fill="none"/><rect x="18" y="37" width="12" height="5" rx="2" fill="#D4AF37" stroke="#8a6a14" stroke-width="1.5"/><path d="M24 42 V47" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M24 6 V30" stroke="#5a3a0a" stroke-width="2.5"/><path d="M26 8 L40 28 H26Z" fill="#F1DDA0" stroke="#8a6a14" stroke-width="2" stroke-linejoin="round"/><path d="M22 12 L10 28 H22Z" fill="#E4C978" stroke="#8a6a14" stroke-width="2" stroke-linejoin="round"/><path d="M4 30 H44 Q40 42 24 42 Q8 42 4 30Z" fill="#B5651D" stroke="#7a4a1e" stroke-width="2.5" stroke-linejoin="round"/></svg>`
];
const WORDS = ['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh'];

function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0, arr.length-1)]; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = randInt(0,i); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function uniqueOptionsAround(correct, min, max, count){
  const set = new Set([correct]);
  let guard = 0;
  while(set.size < count && guard < 200){
    guard++;
    let v = correct + randInt(-3,3);
    if(v < min) v = min + randInt(0,2);
    if(v > max) v = max - randInt(0,2);
    set.add(v);
  }
  return shuffle(Array.from(set));
}
function renderTappableObjects(emoji, n, groupId){
  let html = '';
  for(let i=0;i<n;i++){
    html += `<span class="obj-item" onclick="tapObject(this, '${groupId}')"><span class="obj-emoji">${emoji}</span><span class="tap-label"></span></span>`;
  }
  return html;
}
function tapObject(el, groupId){
  if(el.dataset.tapped) return;
  if(!game.tapCounters) game.tapCounters = {};
  game.tapCounters[groupId] = (game.tapCounters[groupId] || 0) + 1;
  el.dataset.tapped = '1';
  el.classList.add('tapped');
  el.querySelector('.tap-label').textContent = game.tapCounters[groupId];
}

/* ============ QUESTION GENERATORS ============ */
// SECTION A: Menghitung, Membaca, Menulis Bilangan
function genCountingChoice(){
  const n = randInt(1,10);
  const emoji = pick(LOCAL_OBJECTS);
  return {
    type:'choice',
    prompt:'Ada berapa banyak benda di bawah ini? (pencet tiap benda untuk menghitung)',
    visual:`<div class="objects">${renderTappableObjects(emoji,n,'main')}</div>`,
    options: uniqueOptionsAround(n,1,10,4), correct:n
  };
}
function genReadNumberChoice(){
  const n = randInt(1,10);
  const emoji = pick(LOCAL_OBJECTS);
  return {
    type:'choice',
    prompt:'Pilih angka yang sesuai dengan tulisan ini: (pencet benda di bawah untuk membantu menghitung)',
    visual:`<div class="word-display">${WORDS[n]}</div><div class="objects">${renderTappableObjects(emoji,n,'main')}</div>`,
    options: uniqueOptionsAround(n,1,10,4), correct:n
  };
}
function genWriteNumberInput(){
  const n = randInt(1,10);
  const emoji = pick(LOCAL_OBJECTS);
  return {
    type:'input',
    prompt:'Hitung lalu ketik jumlahnya: (pencet tiap benda untuk menghitung)',
    visual:`<div class="objects">${renderTappableObjects(emoji,n,'main')}</div>`,
    correct:n
  };
}
function buildSectionA(){ return [genCountingChoice(), genReadNumberChoice(), genWriteNumberInput(), genCountingChoice()]; }

// SECTION B: Membandingkan Banyak Benda
function genCompare(){
  let a = randInt(1,10), b = randInt(1,10);
  if(Math.random() < 0.2) b = a;
  const emojiL = pick(LOCAL_OBJECTS);
  let emojiR = pick(LOCAL_OBJECTS);
  if(emojiR === emojiL) emojiR = pick(LOCAL_OBJECTS.filter(f=>f!==emojiL));
  const options = ['Kiri lebih banyak','Kanan lebih banyak','Sama banyak'];
  const correctIdx = a > b ? 0 : (b > a ? 1 : 2);
  return {
    type:'choiceWide',
    prompt:'Kelompok mana yang lebih banyak?',
    visual:`<div class="two-groups">
      <div class="group"><div class="group-label">Kiri</div><div class="obj-row">${renderTappableObjects(emojiL,a,'left')}</div></div>
      <div class="group"><div class="group-label">Kanan</div><div class="obj-row">${renderTappableObjects(emojiR,b,'right')}</div></div>
    </div>`,
    options, correct: options[correctIdx]
  };
}
function buildSectionB(){ return [genCompare(), genCompare(), genCompare(), genCompare()]; }

// SECTION C: Menghitung Maju dan Mundur
function genSequence(){
  const forward = Math.random() < 0.5;
  let seq;
  if(forward){ const start = randInt(1,7); seq = [start,start+1,start+2,start+3]; }
  else { const start = randInt(4,10); seq = [start,start-1,start-2,start-3]; }
  const hiddenIndex = randInt(0,3);
  const answer = seq[hiddenIndex];
  const display = seq.map((v,i)=> i===hiddenIndex ? '<div class="seq-item blank">?</div>' : `<div class="seq-item">${v}</div>`).join('');
  return {
    type:'choice',
    prompt: forward ? 'Lengkapi urutan bilangan (maju):' : 'Lengkapi urutan bilangan (mundur):',
    visual:`<div class="seq-display">${display}</div>`,
    options: uniqueOptionsAround(answer,1,10,4), correct: answer
  };
}
function buildSectionC(){ return [genSequence(), genSequence(), genSequence(), genSequence()]; }

// SECTION D: Pasangan Bilangan
function genPair(){
  const target = randInt(2,10);
  const a = randInt(1,target-1);
  const b = target - a;
  return {
    type:'choice',
    prompt:'Lengkapi pasangan bilangan ini:',
    visual:`<div class="word-display">${target} = ${a} + ?</div>`,
    options: uniqueOptionsAround(b,0,10,4), correct:b
  };
}
function buildSectionD(){ return [genPair(), genPair(), genPair(), genPair()]; }

const SECTIONS = [
  { key:'A', title:'Menghitung, Membaca, dan Menulis Bilangan', icon:'🔢', build:buildSectionA },
  { key:'B', title:'Membandingkan Banyak Benda', icon:'⚖️', build:buildSectionB },
  { key:'C', title:'Menghitung Maju dan Mundur', icon:'➡️', build:buildSectionC },
  { key:'D', title:'Pasangan Bilangan', icon:'🧩', build:buildSectionD },
];

/* ============ GAME STATE ============ */
let game = null;

function newGame(){
  const sections = SECTIONS.map(s => ({...s, questions: s.build()}));
  return {
    sections,
    totalQuestions: sections.reduce((sum,s)=>sum+s.questions.length,0),
    sectionIndex: 0, questionIndex: 0,
    correct: 0, wrong: 0, times: [],
    startedAt: null, qStartedAt: null,
    currentInput: '', locked: false
  };
}

const app = document.getElementById('app');

// Sesi dari hub (untuk menyimpan skor). Jika dibuka sendiri, game tetap jalan tanpa simpan skor.
function adaSesi(){
  try { return typeof Auth !== 'undefined' && typeof Score !== 'undefined' && !!Auth.getSession(); }
  catch(e){ return false; }
}

/* ============ RENDER: START SCREEN ============ */
function renderStart(){
  app.innerHTML = `
    <div class="center-icon">🎈🔢🎈</div>
    <h1>Ayo Membilang sampai 10!</h1>
    <p class="muted">Bab 1 — Petualangan Angka untuk Kelas 1 SD</p>
    <ul class="section-list">
      ${SECTIONS.map(s=>`<li><span class="dot">${s.key}</span> ${s.icon} ${s.title}</li>`).join('')}
    </ul>
    ${adaSesi() ? '' : '<div class="note">Kamu belum masuk lewat halaman utama, jadi skor tidak akan tersimpan.</div>'}
    <button class="btn big" onclick="startGame()">Mulai Bermain 🚀</button>
    <a class="btn-link" href="${HUB_URL}">Kembali ke pilihan bab</a>
  `;
}

function startGame(){
  game = newGame();
  game.startedAt = Date.now();
  showSectionIntro();
}

/* ============ RENDER: SECTION INTRO ============ */
function showSectionIntro(){
  const s = game.sections[game.sectionIndex];
  app.innerHTML = `
    <div class="center-icon">${s.icon}</div>
    <h2>Bagian ${s.key}</h2>
    <p>${s.title}</p>
    <p class="muted">Ada ${s.questions.length} soal di bagian ini. Semangat ya!</p>
    <button class="btn big secondary" onclick="showQuestion()">Ayo Mulai ✏️</button>
  `;
}

/* ============ RENDER: PROGRESS BAR ============ */
function renderProgress(){
  let doneCount = 0;
  for(let i=0;i<game.sectionIndex;i++) doneCount += game.sections[i].questions.length;
  doneCount += game.questionIndex;
  const pct = Math.round((doneCount / game.totalQuestions)*100);
  const badges = SECTIONS.map((s,i)=>{
    let cls='badge';
    if(i < game.sectionIndex) cls += ' done';
    else if(i === game.sectionIndex) cls += ' active';
    return `<div class="${cls}">${s.key}</div>`;
  }).join('');
  return `
    <div class="progress-wrap">
      <div class="badges">${badges}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="qcount">${doneCount}/${game.totalQuestions}</div>
    </div>
  `;
}

/* ============ RENDER: QUESTION ============ */
function showQuestion(){
  const s = game.sections[game.sectionIndex];
  const q = s.questions[game.questionIndex];
  game.qStartedAt = Date.now();
  game.currentInput = '';
  game.tapCounters = {};
  game.locked = false;

  let body = '';
  if(q.type === 'choice' || q.type === 'choiceWide'){
    const gridClass = q.type === 'choiceWide' ? 'options opt-wide' : 'options';
    body = `
      ${q.visual}
      <div class="${gridClass}" id="opts">
        ${q.options.map((opt,i)=>`<button class="opt-btn" onclick="answerChoice(this, ${i})">${opt}</button>`).join('')}
      </div>
    `;
  } else if(q.type === 'input'){
    body = `
      ${q.visual}
      <div class="answer-box" id="answerBox">&nbsp;</div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="key-btn" onclick="pressKey(${n})">${n}</button>`).join('')}
      </div>
      <button class="btn big" style="margin-top:12px;" onclick="submitInput()">Cek Jawaban ✅</button>
      <button class="btn" style="background:#E4DDC8;color:var(--indigo-deep);box-shadow:0 6px 0 #C3B992;margin-top:8px;" onclick="clearInput()">Hapus</button>
    `;
  }

  app.innerHTML = `
    ${renderProgress()}
    <h3>${q.prompt}</h3>
    ${body}
    <div class="feedback" id="feedback"></div>
  `;
}

function pressKey(n){
  if(game.locked || game.currentInput.length >= 2) return;
  game.currentInput += String(n);
  document.getElementById('answerBox').textContent = game.currentInput;
}
function clearInput(){
  if(game.locked) return;
  game.currentInput = '';
  document.getElementById('answerBox').innerHTML = '&nbsp;';
}
function submitInput(){
  if(game.locked || game.currentInput === '') return;
  const q = game.sections[game.sectionIndex].questions[game.questionIndex];
  const val = parseInt(game.currentInput, 10);
  finishAnswer(val === q.correct, `${q.correct}`, val);
}

function answerChoice(btn, idx){
  if(game.locked) return;
  const q = game.sections[game.sectionIndex].questions[game.questionIndex];
  const chosen = q.options[idx];
  const opts = document.querySelectorAll('#opts .opt-btn');
  opts.forEach(b=> b.disabled = true);
  const isCorrect = String(chosen) === String(q.correct);
  if(isCorrect){
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    opts.forEach(b=>{ if(b.textContent == q.correct) b.classList.add('correct'); });
  }
  finishAnswer(isCorrect, q.correct, chosen);
}

function finishAnswer(isCorrect, correctVal, givenVal){
  if(game.locked) return;      // cegah ketukan ganda
  game.locked = true;
  game.times.push(Date.now() - game.qStartedAt);
  if(isCorrect){ game.correct++; } else { game.wrong++; }

  const fb = document.getElementById('feedback');
  if(fb){
    fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
    fb.textContent = isCorrect ? 'Benar sekali! 🎉' : `Belum tepat. Jawaban: ${correctVal}`;
  }

  setTimeout(()=>{
    const s = game.sections[game.sectionIndex];
    if(game.questionIndex < s.questions.length - 1){
      game.questionIndex++;
      showQuestion();
    } else if(game.sectionIndex < game.sections.length - 1){
      game.sectionIndex++;
      game.questionIndex = 0;
      showSectionIntro();
    } else {
      showFinalScore();
    }
  }, 1100);
}

/* ============ RENDER: FINAL SCORE ============ */
function formatTime(ms){
  const totalSec = Math.round(ms/1000);
  return `${Math.floor(totalSec/60)}:${String(totalSec % 60).padStart(2,'0')}`;
}

async function simpanSkor(totalTime, avgTime){
  const el = document.getElementById('simpanStatus');
  if(!adaSesi()){ if(el) el.textContent = 'Skor tidak tersimpan (belum masuk lewat halaman utama).'; return; }
  try {
    await Score.saveScore({
      kelas: 1, bab: 1,
      skor: game.correct, maks: game.totalQuestions,
      durasiDetik: Math.round(totalTime/1000),
      rataRataDetik: Math.round(avgTime/100)/10
    });
    if(el) el.textContent = 'Skormu sudah tersimpan.';
  } catch(e){
    if(el) el.textContent = 'Skor belum bisa disimpan.';
  }
}

function showFinalScore(){
  const totalTime = Date.now() - game.startedAt;
  const avgTime = game.times.reduce((a,b)=>a+b,0) / game.times.length;
  const accuracy = Math.round((game.correct / game.totalQuestions) * 100);

  let starCount = 0;
  if(accuracy >= 90) starCount = 3;
  else if(accuracy >= 70) starCount = 2;
  else if(accuracy >= 50) starCount = 1;
  const starsHtml = '⭐'.repeat(starCount) + '☆'.repeat(3-starCount);

  let message = 'Terus berlatih ya, pasti bisa lebih baik!';
  if(accuracy >= 90) message = 'Luar biasa! Kamu jago berhitung! 🎉';
  else if(accuracy >= 70) message = 'Bagus sekali, sedikit lagi sempurna!';
  else if(accuracy >= 50) message = 'Kerja bagus, ayo latihan lagi!';

  app.innerHTML = `
    <div class="center-icon">🏆</div>
    <h2 style="text-align:center;">Selesai! Bab 1: Ayo Membilang sampai 10</h2>
    <div class="stars">${starsHtml}</div>
    <p class="muted" style="text-align:center;">${message}</p>
    <div class="stats-grid">
      <div class="stat-box"><div class="val">${game.correct}</div><div class="lbl">Jawaban Benar</div></div>
      <div class="stat-box"><div class="val">${game.wrong}</div><div class="lbl">Jawaban Salah</div></div>
      <div class="stat-box"><div class="val">${accuracy}%</div><div class="lbl">Akurasi</div></div>
      <div class="stat-box"><div class="val">${formatTime(totalTime)}</div><div class="lbl">Waktu Total</div></div>
      <div class="stat-box" style="grid-column:1/3;"><div class="val">${(avgTime/1000).toFixed(1)} detik</div><div class="lbl">Rata-rata Kecepatan per Soal</div></div>
    </div>
    <p class="muted" id="simpanStatus" style="text-align:center;" role="status"></p>
    <button class="btn big" onclick="startGame()">Main Lagi 🔁</button>
    <a class="btn-link" href="${HUB_URL}">Kembali ke pilihan bab</a>
  `;
  simpanSkor(totalTime, avgTime);
}

/* ============ INIT ============ */
renderStart();
</script>
</body>
</html>

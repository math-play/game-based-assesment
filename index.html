main{position:relative;z-index:1;width:100%;max-width:560px}
.kartu{background:rgba(15,18,64,.88);border:3px double var(--emas);border-radius:22px;padding:32px 26px;text-align:center}
h1,h2{font-family:"Baloo 2",system-ui,sans-serif;color:var(--emas-pucat);margin:0 0 8px;line-height:1.15}
h1{font-size:2.4rem;font-weight:800}
h2{font-size:1.7rem;font-weight:600}
p{margin:0 0 20px}
.sub{font-size:1.05rem}
input{width:100%;font:inherit;font-size:1.2rem;text-align:center;padding:12px 14px;border-radius:12px;
  border:2px solid var(--emas);background:var(--indigo-dalam);color:var(--teks);margin-bottom:14px}
input::placeholder{color:#9EA3D6}
button,.tombol{font:inherit;font-family:"Baloo 2",system-ui,sans-serif;font-weight:600;font-size:1.2rem;
  display:inline-block;text-decoration:none;cursor:pointer;background:var(--emas);color:var(--indigo-dalam);
  border:0;border-radius:14px;padding:12px 26px}
button:hover,.tombol:hover{background:var(--emas-pucat)}
:focus-visible{outline:3px solid var(--emas-pucat);outline-offset:3px}
.tautan{background:none;color:var(--emas-pucat);font-size:1rem;padding:8px;margin-top:14px;text-decoration:underline}
.tautan:hover{background:none;color:#fff}
.galat{color:var(--galat);min-height:1.6em;margin:0 0 10px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:6px}
.grid button,.grid .tombol{width:100%;padding:16px 10px}
.grid .kunci{background:transparent;color:#9EA3D6;border:2px dashed #4A50A0;cursor:not-allowed;font-size:1rem}
.grid .kunci small{display:block;font-family:"Nunito",sans-serif;font-weight:400}
.sapa{font-size:1rem;margin-bottom:16px;color:var(--emas-pucat)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <!-- 1. Sambutan -->
  <section class="kartu" id="s-sambutan">
    <h1>Welcome to Math Play</h1>
    <p class="sub">Mathematical Assessment and Testing Hub Through Play</p>
    <button id="b-mulai">Mulai</button>
  </section>

  <!-- 2. Kode akses -->
  <section class="kartu" id="s-kode" hidden>
    <h2>Masukkan kode akses</h2>
    <p>Minta kode ini kepada guru atau sekolahmu.</p>
    <input id="i-kode" type="text" placeholder="Kode akses" autocomplete="off" autocapitalize="characters" aria-label="Kode akses">
    <div class="galat" id="g-kode" role="alert"></div>
    <button id="b-kode">Masuk</button>
  </section>

  <!-- 3. Nama -->
  <section class="kartu" id="s-nama" hidden>
    <h2>Siapa namamu?</h2>
    <p>Tulis nama atau nomor absenmu supaya skormu tercatat.</p>
    <input id="i-nama" type="text" placeholder="Namamu" maxlength="40" autocomplete="off" aria-label="Nama">
    <div class="galat" id="g-nama" role="alert"></div>
    <button id="b-nama">Lanjut</button>
  </section>

  <!-- 4. Pilih kelas -->
  <section class="kartu" id="s-kelas" hidden>
    <div class="sapa" id="sapa-kelas"></div>
    <h2>Pilih kelas</h2>
    <div class="grid" id="grid-kelas"></div>
    <button class="tautan" id="b-keluar">Keluar</button>
  </section>

  <!-- 5. Pilih bab -->
  <section class="kartu" id="s-bab" hidden>
    <h2 id="j-bab"></h2>
    <div class="grid" id="grid-bab"></div>
    <button class="tautan" id="b-kembali">Kembali ke pilihan kelas</button>
  </section>
</main>

<script>
// Data Math Play. Edit file ini untuk menambah sekolah dan bab.
const MathPlayData = {
  // Kode akses per sekolah disimpan sebagai hash SHA-256 (bukan teks asli).
  // Kode dicek dalam HURUF BESAR. Untuk membuat hash kode baru, jalankan di terminal:
  //   printf "%s" "KODE-SEKOLAH" | sha256sum
  // Kode contoh: DEMO-SDN1 dan DEMO-SDN2 (ganti sebelum dipakai sungguhan).
  sekolah: [
    { nama: "SDN Contoh 1", hash: "728349f5396ef071c084cbe0f239b1f693b96ac299ffa997c5528321ba850085" },
    { nama: "SDN Contoh 2", hash: "ec5c2a5d59fc93049f4fa0f10d3220bb49151c8555ffa5d3ccf496a0fbe7a27f" }
  ],

  // Jumlah bab per kelas (PLACEHOLDER, sesuaikan dengan daftar isi buku).
  jumlahBab: { 1: 8, 2: 8, 3: 8, 4: 8, 5: 8, 6: 8 },

  // Judul bab (opsional). Isi bila sudah ada, contoh: "1-1": "Ayo Membilang sampai dengan 10".
  // Bab tanpa judul tampil sebagai "Bab N".
judulBab: { "1-1": "Ayo Membilang sampai dengan 10", "1-3": "Pengurangan sampai dengan 10", "1-4": "Mengenal Bentuk", "1-5": "Ayo Membilang sampai dengan 20" },
  // Bab yang gamenya sudah ada di folder games/. Format "kelas-bab".
  // File-nya harus bernama games/kelasK-babN.html
  tersedia: ["1-1","1-3", "1-4","1-5"],
};
</script>
<script>
// Autentikasi. Saat ini mengecek hash kode di data (MathPlayData).
// Untuk pindah ke Firebase/Supabase: ganti isi verifyCode() saja,
// kembalikan { ok: true, sekolah: "Nama Sekolah" } atau { ok: false }.
const Auth = {
  _m: null,
  async hash(teks) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(teks));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  },
  async verifyCode(kode) {
    const h = await this.hash(kode.trim().toUpperCase());
    const s = MathPlayData.sekolah.find(x => x.hash === h);
    return s ? { ok: true, sekolah: s.nama } : { ok: false };
  },
  // Sesi berlaku selama tab terbuka. Jika penyimpanan browser diblokir, dipakai memori sementara.
  setSession(data) { this._m = data; try { sessionStorage.setItem("mp_sesi", JSON.stringify(data)); } catch (e) {} },
  getSession() {
    try { return JSON.parse(sessionStorage.getItem("mp_sesi")) || this._m; } catch (e) { return this._m; }
  },
  logout() { this._m = null; try { sessionStorage.removeItem("mp_sesi"); } catch (e) {} }
};
</script>
<script>
// Skor. Saat ini disimpan di browser perangkat ini (localStorage).
// Untuk pindah ke database: ganti isi saveScore() dan list() agar memanggil server.
// Semua game cukup memanggil Score.saveScore(...), tidak perlu diubah.
const Score = {
  KEY: "mp_skor", _m: [],
  // Contoh: Score.saveScore({ kelas: 1, bab: 1, skor: 8, maks: 10, durasiDetik: 95, rataRataDetik: 5.9 })
  // Kolom tambahan (seperti durasiDetik) ikut tersimpan.
  async saveScore({ kelas, bab, skor, maks, ...ekstra }) {
    const sesi = Auth.getSession() || {};
    const catatan = { sekolah: sesi.sekolah || "", nama: sesi.nama || "", kelas, bab, skor, maks, ...ekstra, waktu: new Date().toISOString() };
    const semua = await this.list();
    semua.push(catatan);
    this._m = semua;
    try { localStorage.setItem(this.KEY, JSON.stringify(semua)); } catch (e) {}
    return catatan;
  },
  async list() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch (e) { return this._m.slice(); }
  }
};
</script>
<script>
const $ = id => document.getElementById(id);
const layar = ["sambutan","kode","nama","kelas","bab"];
function tampil(nama){
  layar.forEach(n => $("s-"+n).hidden = (n !== nama));
  const f = document.querySelector("#s-"+nama+" input, #s-"+nama+" button");
  if (f) f.focus();
}

$("b-mulai").onclick = () => tampil("kode");

async function cekKode(){
  const kode = $("i-kode").value;
  if (!kode.trim()) { $("g-kode").textContent = "Isi kode akses dulu."; return; }
  let hasil;
  try { hasil = await Auth.verifyCode(kode); }
  catch (e) {
    $("g-kode").textContent = (window.crypto && crypto.subtle)
      ? "Terjadi kesalahan saat mengecek kode. Coba muat ulang halaman."
      : "Peramban ini belum bisa mengecek kode. Buka halaman lewat https atau localhost.";
    return;
  }
  if (!hasil.ok) { $("g-kode").textContent = "Kode tidak ditemukan. Periksa lagi kode dari sekolahmu."; return; }
  $("g-kode").textContent = "";
  Auth.setSession({ sekolah: hasil.sekolah });
  tampil("nama");
}
$("b-kode").onclick = cekKode;
$("i-kode").onkeydown = e => { if (e.key === "Enter") cekKode(); };

function simpanNama(){
  const nama = $("i-nama").value.trim();
  if (!nama) { $("g-nama").textContent = "Tulis namamu dulu."; return; }
  const sesi = Auth.getSession() || {};
  sesi.nama = nama;
  Auth.setSession(sesi);
  bukaKelas();
}
$("b-nama").onclick = simpanNama;
$("i-nama").onkeydown = e => { if (e.key === "Enter") simpanNama(); };

function bukaKelas(){
  const sesi = Auth.getSession();
  $("sapa-kelas").textContent = "Halo, " + sesi.nama + ". Sekolah: " + sesi.sekolah + ".";
  const g = $("grid-kelas"); g.innerHTML = "";
  Object.keys(MathPlayData.jumlahBab).forEach(k => {
    const b = document.createElement("button");
    b.textContent = "Kelas " + k;
    b.onclick = () => bukaBab(k);
    g.appendChild(b);
  });
  tampil("kelas");
}

function bukaBab(kelas){
  $("j-bab").textContent = "Kelas " + kelas + ": pilih bab";
  const g = $("grid-bab"); g.innerHTML = "";
  for (let n = 1; n <= MathPlayData.jumlahBab[kelas]; n++){
    const kunci = kelas + "-" + n;
    const judul = MathPlayData.judulBab[kunci];
    const label = "Bab " + n + (judul ? ": " + judul : "");
    if (MathPlayData.tersedia.includes(kunci)){
      const a = document.createElement("a");
      a.className = "tombol"; a.textContent = label;
      a.href = "games/kelas" + kelas + "-bab" + n + ".html";
      g.appendChild(a);
    } else {
      const b = document.createElement("button");
      b.className = "kunci"; b.disabled = true;
      b.innerHTML = label + "<small>Segera hadir</small>";
      g.appendChild(b);
    }
  }
  tampil("bab");
}

$("b-kembali").onclick = bukaKelas;
$("b-keluar").onclick = () => { Auth.logout(); $("i-kode").value = ""; $("i-nama").value = ""; tampil("sambutan"); };

// Kembali dari game (?kelas=1) atau sesi masih aktif
(function mulai(){
  const sesi = Auth.getSession();
  const kelas = new URLSearchParams(location.search).get("kelas");
  if (sesi && sesi.nama){
    bukaKelas();
    if (kelas && MathPlayData.jumlahBab[kelas]) bukaBab(kelas);
  } else tampil("sambutan");
})();
</script>
